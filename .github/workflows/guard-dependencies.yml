name: guard-dependencies

on:
  push:
    branches: [main]
  schedule:
    # ADR 0001 records golang.org/x/term as pinned to v0.29.0, the newest
    # release still declaring `go 1.23`. It is not load-bearing and nothing in
    # the code enforces the pin, so re-check weekly and open an issue when a
    # newer floor-compatible release exists. Note that a `latest` well past
    # v0.29.0 is expected and not itself a reason to move — see the issue body.
    - cron: "17 6 * * 1"

# issues: write is scoped to this one job, and only the issue-opening step needs
# it. The push and the weekly schedule are what can actually raise the issue; a
# pull_request run has no business writing to the tracker, and for a fork's pull
# request the token is read-only regardless — so that trigger would silently fail
# the step rather than skip it, which is worse than not running at all. The
# pull_request trigger is gone for the same reason it does not belong here: the
# probe fetches @latest from the network, so its result on someone's branch says
# nothing about whether main's pin can move, and it costs a full runner on every
# PR for a check main already does.
permissions:
  contents: read

jobs:
  x-term-pin:
    name: check x/term pin
    # Pinned, not `ubuntu-latest`: this job's entire value is that it runs
    # unattended on a schedule. `ubuntu-latest` migrates to Ubuntu 26.04 on
    # 2026-10-19; if that migration broke the probe, this job would start
    # failing with nobody watching, and a guard that fails unnoticed is worse
    # than no guard. A pinned image keeps the weekly run reproducible. See the
    # note above `jobs:` in ci.yml for the full reasoning.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Current pin
        id: pin
        run: echo "pinned=$(go list -m -f '{{.Version}}' golang.org/x/term)" >> "$GITHUB_OUTPUT"

      - name: Latest available
        id: latest
        run: |
          cd "$(mktemp -d)"
          go mod init probe >/dev/null 2>&1
          go get golang.org/x/term@latest >/dev/null 2>&1 || true
          echo "latest=$(go list -m -f '{{.Version}}' golang.org/x/term 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      # Deliberately core.setFailed on every error path rather than falling back
      # to a notice: a guard that cannot open its issue and says nothing is a
      # guard that has silently stopped guarding. `unknown` from the probe above
      # counts as an error too — without a comparison there is nothing to report.
      - name: Open an issue when the pin can be lifted
        uses: actions/github-script@v9
        env:
          PINNED: ${{ steps.pin.outputs.pinned }}
          LATEST: ${{ steps.latest.outputs.latest }}
        with:
          script: |
            const pinned = process.env.PINNED.trim();
            const latest = process.env.LATEST.trim();

            if (!pinned || !latest || latest === 'unknown') {
              core.setFailed(
                `could not compare pins (pinned=${pinned}, latest=${latest}); refusing to pass silently`
              );
              return;
            }
            if (pinned === latest) {
              core.info(`${pinned} is current; nothing to do.`);
              return;
            }

            // The marker is what makes this idempotent. The weekly schedule would
            // otherwise open a fresh issue every Monday for as long as the pin
            // stayed put, and the human who fixes it would be buried under them.
            // The marker names the PINNED version, not just the dependency: a
            // run that sees the same pin twice is a duplicate and is suppressed,
            // but a run that sees a genuinely newer pair is a new fact and does
            // open its own issue. A bare constant marker would conflate the two
            // and let the guard go quiet forever after the first report.
            const marker = `<!-- pin-guard:x-term pinned=${pinned} -->`;
            const title = 'golang.org/x/term pin can be lifted';

            // Search BOTH open and closed issues, newest page first. Searching
            // only open ones makes closing an answered issue guarantee it gets
            // reopened on the next run: that is exactly what happened to #7 and
            // #9, which asked a question already answered in #4.
            //
            // The marker embeds the pinned version, so a genuinely newer
            // pinned/latest pair still opens a new issue. A closed issue with the
            // SAME marker means "already asked and answered at this pin", which
            // is the case that must stay quiet.
            const seen = new Map();
            for (const state of ['open', 'closed']) {
              const page = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state,
                per_page: 100,
              });
              // Pull requests come back in the same listing and must be ignored: a
              // PR that happens to share the title is not an issue to suppress.
              for (const i of page.data) {
                if (i.pull_request !== undefined) continue;
                if (i.title === title || (i.body || '').includes(marker)) {
                  if (!seen.has(i.number)) seen.set(i.number, i);
                }
              }
            }
            const prior = [...seen.values()].sort((a, b) => a.number - b.number)[0];
            if (prior) {
              core.info(
                `already tracked by #${prior.number} (${prior.state}); leaving it alone.`
              );
              return;
            }

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                marker,
                '',
                `The weekly pin guard found a newer \`golang.org/x/term\` than the pinned one:`,
                '',
                `- pinned: \`${pinned}\``,
                `- latest: \`${latest}\``,
                '',
                'ADR 0001 pins the dependency because releases past a known boundary declare a `go` directive higher than this module\'s, and `go mod` then rewrites our own floor to match. Compare against that boundary, not against `@latest`: `x/term` through v0.29.0 declares `go 1.18`, v0.30.0 declares `go 1.23.0` (the trailing `.0` makes it a toolchain directive, so it still moves our `go 1.23` floor), and v0.35.0 and later declare `go 1.24.0` or higher. So a `latest` far above v0.29.0 is expected and is not on its own a reason to move. Find the newest release between the pinned version and `latest` whose directive still leaves our floor at `go 1.23`, and bump to it. Note that reading version numbers will not settle this: test with `go get` in a scratch module and read the resulting `go` line. Only raise the module\'s Go floor, and unpin entirely, when that is a change you have separately agreed to.',
                '',
                '_Opened automatically by `.github/workflows/guard-dependencies.yml`. A repeat run seeing the same pinned version adds nothing and stays quiet._',
              ].join('\n'),
            });
            core.info(`opened #${created.data.number}`);