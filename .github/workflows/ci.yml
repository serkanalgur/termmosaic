name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runner images are pinned explicitly rather than via `-latest`.
  #
  # `ubuntu-latest` migrates to Ubuntu 26.04 on 2026-10-19, and `macos-latest` /
  # `windows-latest` move on their own schedules. A `-latest` label therefore
  # changes the toolchain, the C library, and the shell under this project on
  # someone else's date, with no commit and no diff to review — a green run on
  # Friday can be a different environment from the red run on Monday. Pinning
  # names the version CI actually asserts against, so an OS change becomes a
  # visible edit here. Bump these deliberately, in a commit that says why.
  #
  # Pin the matrix legs too: they are the same `-latest` aliases, so leaving
  # them unpinned would leave three of the five gates exposed to a silent
  # migration while the others were safe.

  # Primary gate: build, vet, fmt, and race tests across all target platforms.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Pinned deliberately: ADR 0001 records that raising this floor is what
          # would unpin golang.org/x/term. See docs/adr/0001-backend-strategy.md.
          go-version: "1.23"
          # setup-go keys this cache on go.sum, so a dependency change
          # invalidates it automatically. With -race the instrumented build
          # cache is still reusable across runs per OS/arch, which is where the
          # real time goes.
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        # The windows runner defaults to PowerShell, which cannot parse a bash
        # `if [ -n ... ]` block — it fails with a ParserError before gofmt even
        # runs. Pin the shell so every matrix leg runs the same commands.
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test (race)
        # -count=1 bypasses the test-result cache, which is live by default.
        # Without it a manual re-run can serve a cached PASS instead of
        # re-executing tests — a green that did not actually run, which is the
        # worst possible outcome under a "12/12 green before merge" rule.
        run: go test ./... -race -count=1

  # Dedicated gofmt gate, separate from the matrix job above so the README can
  # badge a status that means "gofmt" and nothing else. The matrix job still
  # checks formatting as part of the primary gate; this job exists purely so
  # the signal is separately addressable and the badge cannot silently start
  # reporting build/vet/test state as if it were formatting state.
  gofmt:
    name: gofmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          # Explicit rather than relying on setup-go's default: this cache is
          # keyed on go.sum, so a dependency change invalidates it
          # automatically. Pinning it here documents that CI depends on it and
          # survives any future change of the action's default.
          cache: true
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  # Dedicated golangci-lint gate, separate from the matrix job above for the same
  # reason as gofmt: the README badges a status that means "lint" and nothing
  # else, so a red matrix leg cannot be misread as a lint finding and a lint
  # finding cannot hide behind a green test run.
  #
  # The version is pinned to the exact release the repository was verified
  # against, for the same reason go-version is pinned in ADR 0001: a lint
  # upgrade is a change in what CI asserts, and @latest would make that change
  # silently, in whichever direction, on someone else's schedule.
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          # Explicit rather than relying on setup-go's default: this cache is
          # keyed on go.sum, so a dependency change invalidates it
          # automatically. Pinning it here documents that CI depends on it and
          # survives any future change of the action's default.
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  # The widget catalog is the product, so guard the zero-allocation claim on the
  # hot path that ADR 0002 established. Run explicitly so a regression is loud.
  no-alloc:
    name: zero-allocation diff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          # Explicit rather than relying on setup-go's default: this cache is
          # keyed on go.sum, so a dependency change invalidates it
          # automatically. Pinning it here documents that CI depends on it and
          # survives any future change of the action's default.
          cache: true
      - name: Assert diff remains zero-allocation
        run: go test ./internal/diff/ -run TestDiffIsZeroAllocation -v

  # ADR 0001 commits to a single static binary with no cgo. If someone adds a
  # dependency that needs cgo, this fails rather than silently breaking
  # cross-compilation for every user.
  cross-compile:
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # goos/goarch are separate matrix keys rather than one "linux/amd64"
      # string split with matrix.target.split('/'). GitHub rejects a method
      # call in that position: the whole workflow fails to produce jobs, in
      # zero seconds, with no annotation -- so it fails silently and the badge
      # is red for a reason nobody can find. Keep these as plain values.
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          # Explicit rather than relying on setup-go's default: this cache is
          # keyed on go.sum, so a dependency change invalidates it
          # automatically. Pinning it here documents that CI depends on it and
          # survives any future change of the action's default.
          cache: true
      - name: Build with CGO disabled
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...